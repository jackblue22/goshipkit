name: goshipkit

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goshipkit}
      POSTGRES_USER: ${POSTGRES_USER:-goshipkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/001-goshipkit.sql:ro

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      GOSHIPKIT_ENV: ${GOSHIPKIT_ENV:-development}
      GOSHIPKIT_HTTP_ADDR: :8080
      GOSHIPKIT_DATABASE_URL: postgres://${POSTGRES_USER:-goshipkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-goshipkit}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
